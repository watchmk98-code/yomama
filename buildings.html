<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- The LOADING screen, once per sign-in. Must run before the
       stylesheets so the page never flashes through underneath. -->
  <script src="./preload-manifest.js?v=1"></script>
  <script src="./loading.js?v=2"></script>
  <title>YOMAMA INVESTMENTS — BUILDINGS</title>
  <meta name="description" content="Build, learn, and grow your business in the YoMama classroom game." />
  <link rel="preload" href="./assets/fonts/VT323-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="./styles.css?v=20260916-one-banner-1" />
  <link rel="stylesheet" href="./econ-kids.css?v=20260916-one-banner-2" />
  <link rel="stylesheet" href="./idle-ui.css?v=20260913-upgrade-feedback" />
  <link rel="stylesheet" href="./business-assets-panel.css?v=20260916-4" />
  <link rel="stylesheet" href="./quests.css?v=20260916-quests-1" />
  <link rel="stylesheet" href="./onboarding.css?v=1" />
</head>
<body class="motion-paused game-page game-build-page">
  <div class="scanlines" aria-hidden="true"></div>

  <div class="shell">
    <header class="hero">
      <div class="topline">
        <div class="left-meta">
          <span class="chip amber">2184 days in the market</span>
          <span class="amber">Tue 23-APR-24</span>
        </div>
        <div class="ticker-container" aria-label="Live price action">
          <div class="ticker-wrap" id="ticker"></div>
        </div>
        <div class="right-meta">
          <span class="amber" id="clock">5:04 PM</span>
          <button class="pill" type="button">LOG OUT</button>
        </div>
      </div>

      <div class="banner-frame">
        <div class="bubble-bg" aria-hidden="true"></div>
        <div id="large-header" class="large-header" aria-hidden="true">
          <canvas id="demo-canvas"></canvas>
        </div>
        <img class="hero-banner" src="./banner-colored.png?v=20260916-sunny-smooth" alt="Sunny Ventures banner" />
      </div>

      <nav class="tabs" aria-label="Primary navigation">
        <a class="tab" href="./index.html">DASH</a>
        <a class="tab active" href="./buildings.html" aria-current="page">GAME</a>
        <a class="tab" href="./flow.html">ANALYSTS</a>
        <a class="tab" href="./memos.html">LEAD</a>
        <a class="tab" href="./analysis.html">NEWS</a>
        <a class="tab" href="./about.html" hidden>PAPER</a>
        <a class="tab" href="./chat.html">CHAT</a>
        <a class="tab" href="./teach.html">TEACH</a>
      </nav>
    </header>

    <main class="game-workspace" aria-label="Build management">
      <div class="game-page-head"><h1>BUILD</h1><nav class="game-nav" aria-label="Business navigation"><a href="./buildings.html" aria-current="page"><img src="./assets/buildings-icons/facility_contractor_office_custom_square.png" alt="" width="28" height="28" aria-hidden="true"><span>Build</span></a><a href="./marketplace.html"><img src="./assets/buildings-icons/facility_marketplace_custom_square.png" alt="" width="28" height="28" aria-hidden="true"><span>Market</span></a><a href="./license.html"><img src="./assets/game-art/badges/licence_unlocked.png" alt="" width="28" height="28" aria-hidden="true"><span>Licence</span></a></nav></div>
      <div id="game-hud" class="econ-kid"></div>
      <div id="econ-building" class="econ-kid"><p class="game-loading" role="status">Opening your business…</p></div>
      <div id="econ-quests" class="econ-kid" aria-label="Quests" hidden></div>
    </main>
  </div>


  <dialog id="game-breakfast" aria-labelledby="game-breakfast-title">
    <div class="game-dialog-head"><h2 id="game-breakfast-title">Breakfast Club</h2><button type="button" class="game-small-button" data-close-breakfast>Close ×</button></div>
    <div id="game-breakfast-content" class="econ-kid"></div>
    <p class="k-status" data-econ-status role="status" aria-live="polite"></p>
  </dialog>

  <svg style="display: none;">
    <symbol viewBox="0 0 44 44" width="44px" height="44px" id="circle" fill="none" stroke="currentColor">
      <circle r="20" cy="22" cx="22" id="test"></circle>
    </symbol>
  </svg>

  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7/dist/pixi.min.js"></script>
  <script src="./buildings-nav.js"></script>
  <script src="./app.js?v=20260915-materials-retired-1"></script>
  <script src="./craft-art.js?v=4"></script>
  <script src="./econ.js?v=20260917-first-shift-1"></script>
  <script src="./account.js?v=1"></script>
  <script src="./econ-nav.js?v=20260916-ops-hidden-1"></script>
  <script src="./game-fit.js?v=20260917-first-shift-1"></script>
  <script src="./quests.js?v=20260916-quests-1"></script>
  <script src="./onboarding.js?v=1"></script>
</body>
</html>
