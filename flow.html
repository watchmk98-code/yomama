<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>YOMAMA INVESTMENTS — HERO SELECT</title>
  <meta name="description" content="Bloomberg-like terminal landing page." />
  <link rel="preload" href="./assets/fonts/VT323-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="./styles.css?v=20260217-6" />
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>

  <div class="shell">
    <header class="hero">
      <div class="topline">
        <div class="left-meta">
          <span class="chip amber">2184 days in the market</span>
          <span class="amber">Tue 23-APR-24</span>
        </div>
        <div class="ticker-container" aria-label="Live price action">
          <div class="ticker-wrap" id="ticker"></div>
        </div>
        <div class="right-meta">
          <span class="amber" id="clock">5:04 PM</span>
          <button class="pill" type="button">LOG OUT</button>
        </div>
      </div>

      <div class="banner-frame">
        <div class="bubble-bg" aria-hidden="true"></div>
        <div id="large-header" class="large-header" aria-hidden="true">
          <canvas id="demo-canvas"></canvas>
        </div>
        <img class="hero-banner" src="./banner-colored.png" alt="YOMAMA Investments banner" />
      </div>

      <nav class="tabs" aria-label="Primary navigation">
        <a class="tab" href="./index.html">DASH</a>
        <a class="tab" href="./collect.html">BUILD</a>
        <a class="tab active" href="./flow.html" aria-current="page">ANALYSTS</a>
        <a class="tab" href="./memos.html">LEAD</a>
        <a class="tab" href="./analysis.html">NEWS</a>
        <a class="tab" href="./about.html" hidden>PAPER</a>
        <a class="tab" href="./chat.html">CHAT</a>
        <a class="tab" href="./port_trading.html">PORT</a>
        <a class="tab" href="./teach.html">TEACH</a>
      </nav>
    </header>

    <main class="mario-select-main" aria-label="Character selection screen">
      <div class="mario-stage">
        <div class="money-rain" aria-hidden="true"></div>
        <div class="curtain curtain-left" aria-hidden="true"></div>
        <div class="curtain curtain-right" aria-hidden="true"></div>

        <div class="mario-select-header">
          <p>PLEASE SELECT</p>
          <p>ANALYST</p>
        </div>

        <div class="mario-roster" role="list" aria-label="Character roster">
          <button class="mario-character player-buffett" type="button" role="listitem" aria-label="Select Warren Buffett" data-character="buffett">
            <img class="mario-sprite" src="./assets/hero-select/player-buffett.png" alt="Warren Buffett pixel portrait" />
            <span class="mario-character-name">BUFFETT</span>
          </button>

          <button class="mario-character player-marks" type="button" role="listitem" aria-label="Select Howard Marks" data-character="marks">
            <img class="mario-sprite" src="./assets/hero-select/player-marks.png" alt="Howard Marks pixel portrait" />
            <span class="mario-character-name">MARKS</span>
          </button>

          <button class="mario-character player-peaker" type="button" role="listitem" aria-label="Select Peaker S" data-character="peaker">
            <img class="mario-sprite" src="./assets/hero-select/player-peaker.png" alt="Peaker S pixel portrait" />
            <span class="mario-character-name">PEAKER S.</span>
          </button>

          <button class="mario-character player-dennis" type="button" role="listitem" aria-label="Select Dennis Younger" data-character="dennis">
            <img class="mario-sprite" src="./assets/hero-select/player-dennis.png" alt="Dennis Younger pixel portrait" />
            <span class="mario-character-name">DENNIS</span>
          </button>

          <button class="mario-character player-irene" type="button" role="listitem" aria-label="Select Irene Carina" data-character="irene">
            <img class="mario-sprite" src="./assets/hero-select/player-irene.png?v=20260216-1" alt="Irene Carina pixel portrait" />
            <span class="mario-character-name">IRENE</span>
          </button>

          <button class="mario-character player-derdo" type="button" role="listitem" aria-label="Select Derdo Merdo" data-character="derdo">
            <img class="mario-sprite" src="./assets/hero-select/player-derdo.png?v=20260216-1" alt="Derdo Merdo pixel portrait" />
            <span class="mario-character-name">DERDO</span>
          </button>

          <button class="mario-character player-ozan" type="button" role="listitem" aria-label="Select Ogan Beyazca" data-character="ozan">
            <img class="mario-sprite" src="./assets/hero-select/player-ozan.png?v=20260216-1" alt="Ogan Beyazca pixel portrait" />
            <span class="mario-character-name">OGAN B.</span>
          </button>

          <button class="mario-character player-hussein" type="button" role="listitem" aria-label="Select Hussein Fire" data-character="hussein">
            <img class="mario-sprite" src="./assets/hero-select/player-hussein.png?v=20260216-1" alt="Hussein Fire pixel portrait" />
            <span class="mario-character-name">HUSSEIN</span>
          </button>

          <button class="mario-character player-can" type="button" role="listitem" aria-label="Select John Townman" data-character="can">
            <img class="mario-sprite" src="./assets/hero-select/player-can.png?v=20260216-1" alt="John Townman pixel portrait" />
            <span class="mario-character-name">JOHN</span>
          </button>

          <button class="mario-character player-hara" type="button" role="listitem" aria-label="Select Hara Turanlee" data-character="hara">
            <img class="mario-sprite" src="./assets/hero-select/player-hara.png?v=20260216-2" alt="Hara Turanlee pixel portrait" />
            <span class="mario-character-name">HARA</span>
          </button>

          <button class="mario-character player-pelli" type="button" role="listitem" aria-label="Select Pelli Turin" data-character="pelli">
            <img class="mario-sprite" src="./assets/hero-select/player-pelli.png?v=20260216-2" alt="Pelli Turin pixel portrait" />
            <span class="mario-character-name">PELLI</span>
          </button>

        </div>

        <div class="hero-bio-overlay" id="hero-bio-overlay" hidden>
          <section class="hero-bio-window terminal-ui" role="dialog" aria-modal="true" aria-labelledby="hero-bio-name">
            <header class="hero-bio-topline">
              <div class="hero-bio-symbol" id="hero-bio-mode-label">BIO/PROFILE</div>
              <button class="hero-bio-close" id="hero-bio-close" type="button" aria-label="Close bio window">CLOSE</button>
            </header>
            <div class="hero-bio-body">
              <aside class="hero-bio-left">
                <div class="hero-bio-portrait-slot" id="hero-bio-portrait-slot"></div>
              </aside>
              <div class="hero-bio-right">
                <div class="hero-bio-header">
                  <h2 class="hero-bio-name" id="hero-bio-name"></h2>
                </div>
                <div class="hero-bio-line"><span class="muted">Age:</span> <span id="hero-bio-age"></span></div>
                <div class="hero-bio-line"><span class="muted">Role:</span> <span id="hero-bio-role"></span></div>
                <div class="hero-bio-line"><span class="muted">Style:</span> <span id="hero-bio-style"></span></div>
                <div class="hero-bio-line"><span class="muted">Signature:</span> <span id="hero-bio-sig"></span></div>
                <p class="hero-bio-text" id="hero-bio-text"></p>
                <div class="hero-bio-actions">
                  <button class="hero-bio-view-portfolio" id="hero-bio-view-portfolio" type="button">VIEW BUILDINGS</button>
                  <button class="hero-bio-view-analysis" id="hero-bio-view-analysis" type="button">VIEW NEWS</button>
                </div>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <svg style="display: none;">
    <symbol viewBox="0 0 44 44" width="44px" height="44px" id="circle" fill="none" stroke="currentColor">
      <circle r="20" cy="22" cx="22" id="test"></circle>
    </symbol>
  </svg>

  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7/dist/pixi.min.js"></script>
  <script src="./app.js?v=20260423-2"></script>
</body>
</html>
