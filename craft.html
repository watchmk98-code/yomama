<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- The full asset LOADING screen. Must run before the
       stylesheets so the page never flashes through underneath. -->
  <script src="./preload-manifest.js?v=2"></script>
  <script src="./loading.js?v=3"></script>
  <title>YOMAMA INVESTMENTS — CRAFT</title>
  <meta name="description" content="Combine products from your businesses to craft new items." />
  <link rel="preload" href="./assets/fonts/VT323-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="./assets/craft/craft-items.png?v=1" as="image" type="image/png">
  <link rel="stylesheet" href="./styles.css?v=20260917-fresh-start" />
  <link rel="stylesheet" href="./econ-kids.css?v=20260917-fresh-start" />
  <link rel="stylesheet" href="./idle-ui.css?v=20260913-upgrade-feedback" />
  <link rel="stylesheet" href="./craft.css?v=19-live-progression" />
  <link rel="stylesheet" href="./craft-dialog-fit.css?v=1" />
  <link rel="stylesheet" href="./business-banner.css?v=8">
</head>
<body class="business-illustrated motion-paused game-page game-craft-page">
  <div class="scanlines" aria-hidden="true"></div>
  <div class="shell">
    <header class="hero">
      <div class="topline">
        <div class="left-meta">
          <span class="chip amber">2184 days in the market</span>
          <span class="amber">Tue 23-APR-24</span>
        </div>
        <div class="ticker-container" aria-label="Live price action">
          <div class="ticker-wrap" id="ticker"></div>
        </div>
        <div class="right-meta">
          <span class="amber" id="clock">5:04 PM</span>
          <button class="pill" type="button">LOG OUT</button>
        </div>
      </div>
      <div class="banner-frame">
        <div class="bubble-bg" aria-hidden="true"></div>
        <div id="large-header" class="large-header" aria-hidden="true"><canvas id="demo-canvas"></canvas></div>
        <img class="hero-banner" src="./banner-colored.png?v=20260916-sunny-smooth" alt="Sunny Ventures banner" />
      </div>
      <nav class="tabs" aria-label="Primary navigation">
        <a class="tab" href="./index.html">DASH</a>
        <a class="tab active" href="./buildings.html" aria-current="page">GAME</a>
        <a class="tab" href="./flow.html">ANALYSTS</a>
        <a class="tab" href="./memos.html">LEAD</a>
        <a class="tab" href="./analysis.html">NEWS</a>
        <a class="tab" href="./about.html" hidden>PAPER</a>
        <a class="tab" href="./chat.html">CHAT</a>
        <a class="tab" href="./teach.html">TEACH</a>
      </nav>
    </header>
    <main class="game-workspace" aria-label="Crafting">
      <div class="game-page-head"><h1>CRAFT</h1><nav class="game-nav" aria-label="Business navigation">
        <a href="./buildings.html"><img src="./assets/buildings-icons/facility_contractor_office_custom_square.png" alt="" width="28" height="28" aria-hidden="true"><span>Build</span></a>
        <a href="./marketplace.html"><img src="./assets/buildings-icons/facility_marketplace_custom_square.png" alt="" width="28" height="28" aria-hidden="true"><span>Market</span></a>
        <a href="./craft.html" aria-current="page"><span>Craft</span></a>
        
        <a href="./license.html"><img src="./assets/game-art/badges/licence_unlocked.png" alt="" width="28" height="28" aria-hidden="true"><span>Licence</span></a>
      </nav></div>
      <div id="game-hud" class="econ-kid"></div>
      <div id="econ-craft" class="craft-content" aria-busy="true">
        <div class="craft-tabs" role="group" aria-label="Catalog"><button type="button" data-craft-section="items" aria-pressed="true">Special products</button><button type="button" data-craft-section="tangible" aria-pressed="false">Tangible Assets</button><button type="button" data-craft-section="intangible" aria-pressed="false">Intangible Assets</button><button type="button" data-craft-section="supplies" aria-pressed="false">Supplies</button></div>
        <p class="craft-intro"><span id="craft-intro-text">Choose an item to see its ingredients.</span><span id="craft-catalog-count"></span></p>
        <p id="craft-notice" class="craft-notice" role="status">Opening your workshop…</p>
        <div id="craft-grid" class="craft-grid" aria-label="Craftable items"></div>
      </div>
    </main>
  </div>
  <dialog id="craft-dialog" aria-labelledby="craft-dialog-title" aria-describedby="craft-makes">
    <div class="craft-dialog-body">
    <div class="craft-dialog-head">
      <h2 id="craft-dialog-title"></h2>
      <button id="craft-close" type="button" aria-label="Close item details" autofocus>×</button>
    </div>
    <div class="craft-dialog-art"><span id="craft-large-icon" class="craft-sprite" aria-hidden="true"></span></div>
    <p id="craft-makes" class="craft-makes">Makes 1</p>
    <div id="craft-asset-detail" hidden></div>
    <table class="craft-ingredients">
      <thead><tr><th scope="col">Ingredients</th><th scope="col">Need</th><th scope="col">Have</th></tr></thead>
      <tbody id="craft-ingredient-rows"></tbody>
    </table>
    <p id="craft-owned" class="craft-owned"></p>
    <p id="craft-reason" class="craft-reason"></p>
    <button id="craft-submit" class="craft-submit" type="button" aria-describedby="craft-reason">CRAFT</button>
    <p id="craft-status" class="craft-status" role="status" aria-live="polite"></p>
    </div>
  </dialog>
  <script src="./buildings-nav.js"></script>
  <script src="./yomama-net.js?v=1"></script>
  <script src="./app.js?v=20260917-fresh-start"></script>
  <script src="./econ.js?v=20260919-neutral-upgrades-1"></script>
  <script src="./account.js?v=1"></script>
  <script src="./econ-nav.js?v=20260919-bank-1"></script>
  <script src="./game-fit.js?v=20260918-art-fit-1"></script>
  <script src="./craft-art.js?v=4"></script>
  <script src="./craft.js?v=20-upgrade-milestones"></script>
  <script src="./craft-dialog-fit.js?v=2-pilot"></script>
</body>
</html>
