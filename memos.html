<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>YOMAMA INVESTMENTS — LEADERBOARD</title>
  <meta name="description" content="Bloomberg-like terminal landing page." />
  <link rel="preload" href="./assets/fonts/VT323-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="./styles.css?v=20260916-sunny-banner" />
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>

  <div class="shell">
    <header class="hero">
      <div class="topline">
        <div class="left-meta">
          <span class="chip amber">2184 days in the market</span>
          <span class="amber">Tue 23-APR-24</span>
        </div>
        <div class="ticker-container" aria-label="Live price action">
          <div class="ticker-wrap" id="ticker"></div>
        </div>
        <div class="right-meta">
          <span class="amber" id="clock">5:04 PM</span>
          <button class="pill" type="button">LOG OUT</button>
        </div>
      </div>

      <div class="banner-frame">
        <div class="bubble-bg" aria-hidden="true"></div>
        <div id="large-header" class="large-header" aria-hidden="true">
          <canvas id="demo-canvas"></canvas>
        </div>
        <img class="hero-banner" src="./banner-colored.png?v=20260916-sunny-smooth" alt="Sunny Ventures banner" />
      </div>

      <nav class="tabs" aria-label="Primary navigation">
        <a class="tab" href="./index.html">DASH</a>
        <a class="tab" href="./buildings.html">GAME</a>
        <a class="tab" href="./flow.html">ANALYSTS</a>
        <a class="tab active" href="./memos.html" aria-current="page">LEAD</a>
        <a class="tab" href="./analysis.html">NEWS</a>
        <a class="tab" href="./about.html" hidden>PAPER</a>
        <a class="tab" href="./chat.html">CHAT</a>
        <a class="tab" href="./port_trading.html">PORT</a>
        <a class="tab" href="./teach.html">TEACH</a>
      </nav>
    </header>

    <main class="memos-stage" aria-label="Leaderboard stage">
      <section class="memos-leaderboard-shell" aria-labelledby="memos-leaderboard-title">
        <header class="memos-leaderboard-header">
          <p class="memos-kicker">LEADERBOARD // ARCADE RANKED MODE</p>
          <h1 class="memos-title" id="memos-leaderboard-title">Street Leaderboard</h1>
          <p class="memos-subtitle">Live ranking board.</p>
          <div class="memos-timeframe-switch" role="tablist" aria-label="Leaderboard timeframe">
            <button
              type="button"
              class="memos-timeframe-btn is-active"
              role="tab"
              aria-selected="true"
              data-timeframe="daily"
            >Daily</button>
            <button
              type="button"
              class="memos-timeframe-btn"
              role="tab"
              aria-selected="false"
              data-timeframe="weekly"
            >Weekly</button>
            <button
              type="button"
              class="memos-timeframe-btn"
              role="tab"
              aria-selected="false"
              data-timeframe="monthly"
            >Monthly</button>
          </div>
          <div class="memos-timeframe-meta" aria-live="polite" aria-label="Leaderboard update timestamps">
            <span class="memos-timeframe-meta-item" data-timeframe-meta="daily">D: --:--:--</span>
            <span class="memos-timeframe-meta-item" data-timeframe-meta="weekly">W: --:--:--</span>
            <span class="memos-timeframe-meta-item" data-timeframe-meta="monthly">M: --:--:--</span>
          </div>
        </header>

        <div class="memos-leaderboard-layout">
          <section class="memos-roster" aria-label="Class standings" hidden></section>
          <div class="memos-access" id="memos-access">
            <p id="memos-access-message" role="status">Loading the class standings…</p>
            <a class="pill" href="./join.html">JOIN A CLASS</a>
            <a class="pill" href="./buildings.html">BACK TO GAME</a>
          </div>
          <template id="memos-fighter-template">
            <article class="memos-fighter" tabindex="0">
              <span class="memos-fighter-bg" aria-hidden="true"><canvas class="memos-fighter-bg-canvas"></canvas></span>
              <span class="memos-rank">#1</span>
              <span class="memos-fighter-portrait-shell">
                <img class="memos-fighter-portrait" src="" alt="" loading="lazy" decoding="async" />
              </span>
              <span class="memos-fighter-body">
                <span class="memos-fighter-name"></span>
                <span class="memos-fighter-style"></span>
              </span>
              <span class="memos-fighter-points"><span class="memos-points-label">PTS</span><span class="memos-points-value">0</span></span>
            </article>
          </template>
        </div>
      </section>
    </main>
  </div>

  <svg style="display: none;">
    <symbol viewBox="0 0 44 44" width="44px" height="44px" id="circle" fill="none" stroke="currentColor">
      <circle r="20" cy="22" cx="22" id="test"></circle>
    </symbol>
  </svg>

  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7/dist/pixi.min.js"></script>
  <script src="./yomama-net.js?v=1"></script>
  <script src="./app.js?v=20260912-1"></script>
  <script src="./memos-bars.js?v=20260912-live"></script>
  <script src="./account.js?v=1"></script>
  <script src="./econ-nav.js?v=3"></script>
</body>
</html>
