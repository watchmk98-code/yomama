name: Part 1 economy
on: [push, pull_request]
jobs:
  economy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m pytest tests -q
      - run: node --check econ.js && node --check econ-nav.js && node --check teacher-econ.js && node --check account.js && node --check yomama-net.js
