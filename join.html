<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>YOMAMA INVESTMENTS — JOIN CLASS</title>
  <meta name="description" content="Join your class with a code." />
  <link rel="preload" href="./assets/fonts/VT323-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="./styles.css?v=20260912-live2" />
  <style>
    .join-wrap{ min-height:100vh; display:grid; place-items:center; padding:var(--s4,20px); }
    .join-card{ width:min(420px,100%); border:1px solid var(--border); background:#000; padding:28px 26px; }
    .join-title{ color:var(--amber); font-size:28px; letter-spacing:.06em; margin:0 0 4px; }
    .join-sub{ color:var(--muted); margin:0 0 22px; font-size:15px; }
    .join-field{ margin-bottom:16px; }
    .join-field label{ display:block; color:var(--amber); font-size:14px; letter-spacing:.08em; margin-bottom:6px; }
    .join-field input{
      width:100%; background:#000; color:var(--text); border:1px solid var(--line);
      padding:11px 12px; font-family:inherit; font-size:20px; letter-spacing:.14em; border-radius:0;
    }
    .join-field input:focus{ outline:none; border-color:var(--amber); }
    #join-code{ text-transform:uppercase; }
    .join-btn{
      width:100%; margin-top:8px; padding:12px; background:var(--amber); color:#000;
      border:none; border-radius:0; font-family:inherit; font-size:19px; letter-spacing:.1em; cursor:pointer;
    }
    .join-btn:disabled{ opacity:.5; cursor:not-allowed; }
    .join-msg{ margin-top:16px; font-size:15px; min-height:22px; }
    .join-msg.err{ color:var(--red); } .join-msg.ok{ color:var(--green); } .join-msg.info{ color:var(--muted); }
    .join-foot{ margin-top:20px; padding-top:16px; border-top:1px solid var(--line); font-size:14px; color:var(--muted); }
    .join-foot a{ color:var(--amber); }
  </style>
</head>
<body class="motion-paused">
  <div class="scanlines" aria-hidden="true"></div>
  <div class="join-wrap">
    <main class="join-card">
      <h1 class="join-title">JOIN YOUR CLASS</h1>
      <p class="join-sub">Enter the code on the board. No password needed.</p>

      <form id="join-form" autocomplete="off">
        <div class="join-field">
          <label for="join-code">CLASS CODE</label>
          <input id="join-code" name="code" maxlength="5" placeholder="ABC12" required
                 inputmode="latin" autocapitalize="characters" spellcheck="false" />
        </div>
        <div class="join-field">
          <label for="join-name">YOUR NAME</label>
          <input id="join-name" name="name" maxlength="24" placeholder="ALEX K" required spellcheck="false" />
        </div>
        <div class="join-field">
          <label for="join-pin">4-DIGIT PIN</label>
          <input id="join-pin" name="pin" maxlength="4" placeholder="0000" required
                 inputmode="numeric" pattern="[0-9]{4}" autocomplete="off" spellcheck="false" />
          <div style="color:var(--muted); font-size:13px; margin-top:5px">
            Pick any four digits and remember them. You need the same PIN to get
            back into your game on another computer.
          </div>
        </div>
        <button class="join-btn" id="join-btn" type="submit">ENTER THE MARKET</button>
      </form>

      <div class="join-msg info" id="join-msg" role="status" aria-live="polite"></div>
      <div class="join-foot" id="join-foot"></div>
    </main>
  </div>

  <script src="./yomama-net.js?v=1"></script>
  <script>
    (function () {
      var form = document.getElementById('join-form');
      var codeEl = document.getElementById('join-code');
      var nameEl = document.getElementById('join-name');
      var btn = document.getElementById('join-btn');
      var msg = document.getElementById('join-msg');
      var foot = document.getElementById('join-foot');
      var net = window.YomamaNet;

      // The server sends a browser without a seat here with ?next=<the page it
      // wanted>. Only a path on this site is honoured, never another origin.
      var next = (window.location.search.match(/[?&]next=([^&]*)/) || [])[1];
      try { next = next ? decodeURIComponent(next) : ''; } catch (e) { next = ''; }
      // The URL parser drops tabs and newlines before it reads the string, so
      // drop every control character first; then let the parser, not a regex,
      // say which origin the value means.
      next = next.split('').filter(function (ch) { var c = ch.charCodeAt(0); return c > 31 && c !== 127; }).join('');
      try {
        var target = new URL(next, window.location.href);
        next = (next.charAt(0) === '/' && target.origin === window.location.origin
                && !/\/join\.html$/i.test(target.pathname)) ? target.pathname + target.search : '';
      } catch (e) { next = ''; }
      var afterJoin = next || './buildings.html';

      // account.js sends people here after LOG OUT or an idle sign-out.
      var why = (window.location.search.match(/[?&]signedout=([^&]*)/) || [])[1];
      if (why === 'idle') say('You were signed out after a while without activity. Sign in again to continue.', 'info');
      else if (why) say('Signed out. The next person can sign in here.', 'info');

      function say(text, tone) { msg.textContent = text; msg.className = 'join-msg ' + (tone || 'info'); }

      // Already in a class? Offer to continue or switch.
      if (net && net.isJoined()) {
        var s = net.session();
        foot.innerHTML = 'Signed in as <strong>' + s.name + '</strong> in class <strong>' + s.code +
          '</strong>. <a href="./buildings.html">Continue</a> &middot; <a href="#" id="join-leave">leave</a>';
        var leave = document.getElementById('join-leave');
        if (leave) leave.addEventListener('click', function (e) {
          e.preventDefault(); net.leave(); window.location.reload();
        });
        codeEl.value = s.code;
        nameEl.value = s.name;
        // Sent here for a page while already signed in (the cookie was missing,
        // say): confirm the seat still exists, then go straight on.
        if (next) {
          // A browser that cannot keep the cookie would bounce between here
          // and the page for ever; after a few quick returns, stop and say so.
          var bounces = 1;
          try {
            var b = JSON.parse(sessionStorage.getItem('yomama_bounce') || '[0,0]');
            bounces = (Date.now() - b[1] < 30000) ? b[0] + 1 : 1;
            sessionStorage.setItem('yomama_bounce', JSON.stringify([bounces, Date.now()]));
          } catch (e) {}
          if (bounces > 3) {
            say('This browser is not keeping the sign-in cookie, so pages cannot open. '
              + 'Allow cookies for this site, then sign in again.', 'err');
          } else {
            say('Checking your seat...', 'info');
            net.connect().then(function (live) {
              if (live) window.location.replace(next);
              else { foot.textContent = ''; say('Your seat is no longer valid. Sign in again.', 'err'); }
            });
          }
        }
      }

      var pinEl = document.getElementById('join-pin');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var code = codeEl.value.trim().toUpperCase();
        var name = nameEl.value.trim();
        var pin = pinEl.value.trim();
        if (!code || !name || !pin) { say('All three fields are required.', 'err'); return; }
        if (!/^[0-9]{4}$/.test(pin)) { say('The PIN must be exactly four digits.', 'err'); return; }
        if (!net) { say('Game script failed to load. Reload the page.', 'err'); return; }

        btn.disabled = true;
        say('Joining...', 'info');
        net.join(code, name, pin).then(function (res) {
          say(res.rejoined
            ? 'Welcome back, ' + res.name + '. Restoring your base...'
            : 'Joined class ' + res.code + '. Setting up your base...', 'ok');
          window.setTimeout(function () { window.location.href = afterJoin; }, 700);
        }).catch(function (err) {
          btn.disabled = false;
          var m = (err && err.message) || 'Could not reach the server.';
          if (err && err.status === 404) m = 'No class with that code. Check the board.';
          if (err && err.status === 409) pinEl.focus();
          say(m, 'err');
        });
      });

      codeEl.addEventListener('input', function () {
        this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      });
      pinEl.addEventListener('input', function () {
        this.value = this.value.replace(/[^0-9]/g, '').slice(0, 4);
      });
    }());
  </script>
</body>
</html>
